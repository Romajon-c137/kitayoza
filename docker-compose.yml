services:
  postgres:
    image: postgres:16
    container_name: wholesale-postgres
    environment:
      POSTGRES_DB: wholesale
      POSTGRES_USER: wholesale
      POSTGRES_PASSWORD: wholesale
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wholesale -d wholesale"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
